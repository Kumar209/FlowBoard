@if (open()) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-3 sm:p-4">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" (click)="closed.emit()"></div>

    <div class="relative z-[101] w-full max-w-md overflow-hidden rounded-2xl border border-base-300 bg-base-100 shadow-2xl">
      <div class="flex items-start justify-between gap-3 border-b border-base-200 px-4 py-4 sm:px-5">
        <div class="flex min-w-0 items-center gap-3">
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-base-300 bg-base-200 text-base-content/70">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3 4.5 6v5.5c0 4.7 3.1 7.9 7.5 9.5 4.4-1.6 7.5-4.8 7.5-9.5V6L12 3Z"/>
              <path stroke-linecap="round" d="M12 8v4M12 15h.01"/>
            </svg>
          </div>

          <div class="min-w-0">
            <h3 class="text-base font-semibold text-base-content sm:text-lg">Feature Unavailable</h3>
            <p class="mt-0.5 text-xs text-base-content/60">This feature is currently unavailable.</p>
          </div>
        </div>

        <button type="button" class="btn btn-ghost btn-sm btn-square shrink-0 rounded-lg text-base-content/70 hover:text-base-content" (click)="closed.emit()" aria-label="Close">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>

      <div class="px-4 py-5 sm:px-5 sm:py-6">
        <div class="rounded-xl border border-base-200 bg-base-200/30 p-3.5 sm:p-4">
          <div class="flex items-start gap-3">
            <div class="mt-0.5 shrink-0">
              <svg class="h-4 w-4 text-base-content/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="9"/>
                <path stroke-linecap="round" d="M12 11v5M12 8h.01"/>
              </svg>
            </div>

            <div class="min-w-0">
              <p class="text-sm leading-6 text-base-content">
                <span class="font-medium">{{ featureName() }}</span>
                is currently disabled by
                <span class="font-medium">{{ disabledBy() }}</span>.
              </p>
            </div>
          </div>
        </div>

        <p class="mt-3 text-xs leading-5 text-base-content/60">
          Please contact your organization owner or platform SuperAdmin to enable this feature.
        </p>
      </div>

      <div class="flex justify-end border-t border-base-200 px-4 py-3 sm:px-5">
        <button type="button" class="btn btn-primary btn-sm w-full rounded-lg sm:w-auto sm:min-w-20" (click)="closed.emit()">
          OK
        </button>
      </div>
    </div>
  </div>
}
