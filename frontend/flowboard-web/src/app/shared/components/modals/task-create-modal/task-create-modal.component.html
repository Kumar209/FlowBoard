@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" (click)="closed.emit()"></div>
    <div class="card bg-base-100 rounded-2xl shadow-2xl max-w-lg w-full p-6 relative z-10 border max-h-[90vh] overflow-y-auto">
      <h3 class="font-bold text-lg">Create Task in {{ listName() }}</h3>
      <p class="text-xs opacity-40">Add enough details — task will appear in this column and is draggable to other statuses.</p>
      <div class="mt-4 space-y-3">
        <label class="form-control">
          <span class="label-text text-xs">Title *</span>
          <input type="text" class="input input-bordered rounded-xl" placeholder="e.g., Implement login" [value]="title()" (input)="title.set($any($event.target).value)" />
          @if (!isValid() && title().length===0) { <span class="text-error text-xs"></span> }
        </label>
        <label class="form-control">
          <span class="label-text text-xs">Description</span>
          <textarea class="textarea textarea-bordered rounded-xl" placeholder="Optional details" [value]="description()" (input)="description.set($any($event.target).value)"></textarea>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="form-control">
            <span class="label-text text-xs">Priority</span>
            <select class="select select-bordered rounded-xl" [value]="priority()" (change)="priority.set($any($event.target).value)">
              <option>Low</option><option>Medium</option><option>High</option><option>Urgent</option>
            </select>
          </label>
          <label class="form-control">
            <span class="label-text text-xs">Due date</span>
            <input type="date" class="input input-bordered rounded-xl" [value]="dueDate()" (input)="dueDate.set($any($event.target).value)" />
          </label>
        </div>
        <label class="form-control">
          <span class="label-text text-xs">Labels (comma separated)</span>
          <input type="text" class="input input-bordered rounded-xl" placeholder="e.g., bug, frontend" [value]="labels()" (input)="labels.set($any($event.target).value)" />
        </label>
        @if (error()) { <div class="text-error text-xs">● {{ error() }}</div> }
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button class="btn btn-ghost rounded-xl" (click)="closed.emit()">Cancel</button>
        <button class="btn btn-primary rounded-xl" (click)="submit()" [class.loading]="loading()" [disabled]="!isValid()">Create</button>
      </div>
    </div>
  </div>
}
