@if (open()) {
  <div class="fixed inset-0 z-[80] flex items-center justify-center p-3 sm:p-4">
    <div class="absolute inset-0 bg-neutral/50 backdrop-blur-sm" (click)="cancelled.emit()"></div>

    <section class="relative z-10 w-full max-w-md overflow-hidden rounded-2xl border border-base-300 bg-base-100 shadow-2xl">
      <div class="px-4 pt-5 sm:px-6 sm:pt-6">
        <div class="flex items-start gap-3 sm:gap-4">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-error/10 text-error">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 7l1 13h10l1-13M9 7V4h6v3"></path>
            </svg>
          </div>

          <div class="min-w-0 flex-1">
            <h3 class="text-base font-semibold tracking-tight text-base-content">{{ title() }}</h3>
            <p class="mt-2 text-sm leading-6 text-base-content/65">{{ message() }}</p>
          </div>

          <button
            type="button"
            class="btn btn-ghost btn-sm h-8 w-8 min-h-8 shrink-0 rounded-lg p-0 text-base-content/50 hover:bg-base-200 hover:text-base-content"
            (click)="cancelled.emit()"
            aria-label="Close"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>

        <div class="mt-5 rounded-xl border border-error/20 bg-error/5 px-3.5 py-3">
          <div class="flex items-start gap-2">
            <svg class="mt-0.5 h-4 w-4 shrink-0 text-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9"></circle>
              <path stroke-linecap="round" d="M12 8v5M12 16h.01"></path>
            </svg>
            <p class="text-xs leading-5 text-error">
              This action is permanent and cannot be undone.
            </p>
          </div>
        </div>
      </div>

      <div class="mt-6 border-t border-base-300 bg-base-200/30 px-4 py-3 sm:px-6 sm:py-4">
        <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button
            class="btn btn-ghost btn-sm h-10 w-full rounded-lg px-4 text-base-content sm:w-auto"
            (click)="cancelled.emit()"
            [disabled]="loading()"
          >
            Cancel
          </button>

          <button
            class="btn btn-error btn-sm h-10 w-full rounded-lg px-5 text-error-content sm:w-auto"
            (click)="confirmed.emit()"
            [class.loading]="loading()"
            [disabled]="loading()"
          >
            @if (!loading()) {
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 7l1 13h10l1-13M9 7V4h6v3"></path>
              </svg>
            }
            Delete
          </button>
        </div>
      </div>
    </section>
  </div>
}
