@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" (click)="cancelled.emit()"></div>
    <div class="card bg-base-100 rounded-2xl shadow-2xl max-w-md w-full p-6 relative z-10 border">
      <h3 class="font-bold text-lg">⚠️ {{ title() }}</h3>
      <p class="text-sm opacity-60 mt-2">{{ message() }}</p>
      <div class="flex justify-end gap-2 mt-6">
        <button class="btn btn-ghost rounded-xl" (click)="cancelled.emit()">Cancel</button>
        <button class="btn btn-error rounded-xl text-white" (click)="confirmed.emit()" [class.loading]="loading()">Delete</button>
      </div>
    </div>
  </div>
}
