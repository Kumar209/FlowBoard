@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" (click)="closed.emit()"></div>
    <div class="card bg-base-100 rounded-2xl shadow-2xl max-w-lg w-full p-6 relative z-10 border">
      <h3 class="font-bold text-lg">{{ isUpdate() ? 'Update Project' : 'Create Project' }}</h3>
      <p class="text-xs opacity-40 mt-1">{{ isUpdate() ? 'Rename project (Key stays, e.g., FB-3)' : 'Key auto like FB-3 / MAR-1' }}</p>
      <div class="mt-4 space-y-3">
        @if (!isUpdate()) {
          <label class="form-control">
            <span class="label-text text-xs">Workspace</span>
            <div class="dropdown w-full" [class.dropdown-open]="dropdownOpen()">
              <div tabindex="0" role="button" class="input input-bordered rounded-xl flex items-center justify-between cursor-pointer" (click)="dropdownOpen.set(!dropdownOpen())">
                <span>{{ selectedWorkspaceName() }}</span>
                <span>▼</span>
              </div>
              @if (dropdownOpen()) {
                <div class="dropdown-content menu bg-base-100 rounded-xl z-20 w-full p-2 shadow border mt-1">
                  <input type="text" placeholder="Search workspace..." class="input input-bordered input-sm rounded-xl mb-2" [value]="wsSearch()" (input)="wsSearch.set($any($event.target).value)" />
                  @for (ws of filteredWorkspaces(); track ws.id) {
                    <li><a (click)="workspaceId.set(ws.id); dropdownOpen.set(false); wsSearch.set('')" [class.active]="workspaceId()===ws.id">{{ ws.name }}</a></li>
                  }
                  @if (filteredWorkspaces().length===0) { <li class="text-xs opacity-40 p-2">No match</li> }
                </div>
              }
            </div>
          </label>
        }
        <label class="form-control">
          <span class="label-text text-xs">Name *</span>
          <input type="text" class="input input-bordered rounded-xl" placeholder="e.g., FlowBoard Demo" [value]="name()" (input)="name.set($any($event.target).value)" />
        </label>
        <label class="form-control">
          <span class="label-text text-xs">Description</span>
          <textarea class="textarea textarea-bordered rounded-xl" placeholder="Optional" [value]="description()" (input)="description.set($any($event.target).value)"></textarea>
        </label>
        @if (error()) { <div class="text-error text-xs">● {{ error() }}</div> }
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button class="btn btn-ghost rounded-xl" (click)="closed.emit()">Cancel</button>
        <button class="btn btn-primary rounded-xl" (click)="submit()" [class.loading]="loading()">{{ isUpdate() ? 'Update' : 'Create' }}</button>
      </div>
    </div>
  </div>
}
