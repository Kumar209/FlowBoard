@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" (click)="closed.emit()"></div>

    <section class="relative z-10 flex max-h-[92vh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-base-300 bg-base-100 shadow-2xl">
      <div class="shrink-0 border-b border-base-200 px-4 py-4 sm:px-6 sm:py-5">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h3 class="text-base font-semibold tracking-tight text-base-content sm:text-lg">
              {{ isUpdate() ? 'Update Project' : 'Create Project' }}
            </h3>
            <p class="mt-1 text-xs leading-5 text-base-content/55">
              {{ isUpdate() ? 'Rename project. The project key remains unchanged.' : 'Create a project inside one of your workspaces.' }}
            </p>
          </div>

          <button
            type="button"
            class="btn btn-ghost btn-sm h-8 w-8 min-h-8 shrink-0 rounded-lg p-0 text-base-content/50 hover:bg-base-200 hover:text-base-content"
            (click)="closed.emit()"
            aria-label="Close"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-6 sm:py-5">
        <div class="space-y-4">
          @if (!isUpdate()) {
            <label class="form-control w-full">
              <span class="mb-1.5 text-xs font-medium text-base-content/70">Workspace</span>

              <div class="dropdown w-full" [class.dropdown-open]="dropdownOpen()">
                <button
                  type="button"
                  class="input input-bordered flex h-10 w-full items-center justify-between rounded-lg border-base-content/20 bg-base-100 text-left text-sm text-base-content shadow-none focus:border-base-content/40 focus:outline-none focus:ring-0"
                  (click)="dropdownOpen.set(!dropdownOpen())"
                >
                  <span class="truncate" [class.text-base-content/40]="!workspaceId()">
                    {{ selectedWorkspaceName() }}
                  </span>
                  <svg class="h-4 w-4 shrink-0 text-base-content/45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>

                @if (dropdownOpen()) {
                  <div class="dropdown-content menu z-30 mt-1 w-full max-w-[calc(100vw-2rem)] rounded-xl border border-base-300 bg-base-100 p-2 shadow-xl">
                    <input
                      type="text"
                      placeholder="Search workspace..."
                      class="input input-bordered input-sm mb-2 h-9 rounded-lg border-base-content/20 bg-base-100 text-xs text-base-content shadow-none focus:border-base-content/40 focus:outline-none focus:ring-0"
                      [value]="wsSearch()"
                      (input)="wsSearch.set($any($event.target).value)"
                    />

                    @for (ws of filteredWorkspaces(); track ws.id) {
                      <li>
                        <a
                          class="rounded-lg text-xs text-base-content"
                          [class.active]="workspaceId() === ws.id"
                          (click)="workspaceId.set(ws.id); dropdownOpen.set(false); wsSearch.set('')"
                        >
                          {{ ws.name }}
                        </a>
                      </li>
                    }

                    @if (filteredWorkspaces().length === 0) {
                      <li class="p-2 text-xs text-base-content/50">No workspace found</li>
                    }
                  </div>
                }
              </div>
            </label>
          }

          <label class="form-control w-full">
            <span class="mb-1.5 text-xs font-medium text-base-content/70">
              Name <span class="text-error">*</span>
            </span>
            <input
              type="text"
              class="input input-bordered h-10 rounded-lg border-base-content/20 bg-base-100 text-sm text-base-content shadow-none focus:border-base-content/40 focus:outline-none focus:ring-0"
              placeholder="e.g. FlowBoard Demo"
              [value]="name()"
              (input)="name.set($any($event.target).value)"
            />
          </label>

          <label class="form-control w-full">
            <span class="mb-1.5 text-xs font-medium text-base-content/70">Description</span>
            <textarea
              class="textarea textarea-bordered min-h-24 w-full rounded-lg border-base-content/20 bg-base-100 text-sm leading-5 text-base-content shadow-none focus:border-base-content/40 focus:outline-none focus:ring-0"
              placeholder="Add a short description..."
              [value]="description()"
              (input)="description.set($any($event.target).value)"
            ></textarea>
          </label>

          @if (error()) {
            <div class="flex items-start gap-2 rounded-xl border border-error/20 bg-error/5 px-3 py-2.5">
              <svg class="mt-0.5 h-4 w-4 shrink-0 text-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="9"></circle>
                <path stroke-linecap="round" d="M12 8v5M12 16h.01"></path>
              </svg>
              <p class="text-xs leading-5 text-error">{{ error() }}</p>
            </div>
          }
        </div>
      </div>

      <div class="shrink-0 border-t border-base-300 bg-base-200/30 px-4 py-3 sm:px-6 sm:py-4">
        <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button
            type="button"
            class="btn btn-ghost btn-sm h-10 w-full rounded-lg px-4 text-base-content sm:w-auto"
            (click)="closed.emit()"
            [disabled]="loading()"
          >
            Cancel
          </button>

          <button
            type="button"
            class="btn btn-primary btn-sm h-10 w-full rounded-lg px-5 sm:w-auto"
            (click)="submit()"
            [class.loading]="loading()"
            [disabled]="loading()"
          >
            @if (!loading()) {
              @if (isUpdate()) {
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 20h9"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"></path>
                </svg>
              } @else {
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" d="M12 5v14M5 12h14"></path>
                </svg>
              }
            }
            {{ isUpdate() ? 'Update Project' : 'Create Project' }}
          </button>
        </div>
      </div>
    </section>
  </div>
}
