@if (open()) {
  <div class="fixed inset-0 z-[70] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-neutral/40 backdrop-blur-sm" (click)="closed.emit()"></div>

    <section class="relative z-10 w-full max-w-lg overflow-hidden rounded-2xl border border-base-300 bg-base-100 shadow-2xl">
      <div class="flex items-start justify-between gap-4 border-b border-base-300 px-5 py-5 sm:px-6">
        <div class="flex min-w-0 items-start gap-3">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary">
            @if (isUpdate()) {
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 20h9"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"></path>
              </svg>
            } @else {
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <path stroke-linecap="round" d="M12 8v8M8 12h8"></path>
              </svg>
            }
          </div>

          <div class="min-w-0">
            <h3 class="text-base font-semibold tracking-tight text-base-content">
              {{ isUpdate() ? 'Update workspace' : 'Create workspace' }}
            </h3>
            <p class="mt-1 text-xs leading-5 text-base-content/50">
              {{ isUpdate() ? 'Update the workspace name or slug.' : 'Create a workspace for your organization.' }}
            </p>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-ghost btn-sm h-8 w-8 min-h-8 rounded-lg p-0 text-base-content/45 hover:bg-base-200 hover:text-base-content"
          (click)="closed.emit()"
          aria-label="Close"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>

      <div class="space-y-5 px-5 py-5 sm:px-6">
        @if (!isUpdate()) {
          <label class="block">
            <span class="mb-1.5 block text-xs font-semibold text-base-content/70">Organization</span>
            <select
              class="select select-bordered h-11 w-full rounded-xl border-base-300 bg-base-100 text-sm focus:border-primary focus:outline-none"
              [value]="orgId()"
              (change)="orgId.set($any($event.target).value)"
            >
              @for (org of organizations(); track org.id) {
                <option [value]="org.id">{{ org.name }} ({{ org.slug }})</option>
              }
              @if (organizations().length === 0) {
                <option value="">No organization</option>
              }
            </select>
          </label>
        }

        <label class="block">
          <span class="mb-1.5 block text-xs font-semibold text-base-content/70">Workspace name <span class="text-error">*</span></span>
          <input
            type="text"
            class="input input-bordered h-11 w-full rounded-xl border-base-300 bg-base-100 text-sm focus:border-primary focus:outline-none"
            placeholder="e.g. Marketing"
            [value]="name()"
            (input)="name.set($any($event.target).value)"
          />
        </label>

        <label class="block">
          <div class="mb-1.5 flex items-center justify-between gap-3">
            <span class="text-xs font-semibold text-base-content/70">
              Slug
              <span class="font-normal text-base-content/40">{{ isUpdate() ? '(editable)' : '(optional, auto)' }}</span>
            </span>
            <span class="font-mono text-[10px] text-base-content/35">a-z 0-9 -</span>
          </div>

          <input
            type="text"
            class="input input-bordered h-11 w-full rounded-xl border-base-300 bg-base-100 font-mono text-sm focus:border-primary focus:outline-none"
            placeholder="marketing-eaec"
            [value]="slug()"
            (input)="slug.set($any($event.target).value)"
          />

          @if (slug() && !slug().match('^[a-z0-9-]+$')) {
            <p class="mt-1.5 flex items-center gap-1.5 text-xs text-error">
              <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" d="M12 9v4m0 4h.01"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.3 3.8 2.9 18a2 2 0 0 0 1.8 3h14.6a2 2 0 0 0 1.8-3L13.7 3.8a2 2 0 0 0-3.4 0Z"></path>
              </svg>
              Use only lowercase letters, numbers and hyphens.
            </p>
          }
        </label>

        @if (error()) {
          <div class="flex items-start gap-2 rounded-xl border border-error/20 bg-error/5 px-3.5 py-3 text-xs text-error">
            <svg class="mt-0.5 h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" d="M12 9v4m0 4h.01"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.3 3.8 2.9 18a2 2 0 0 0 1.8 3h14.6a2 2 0 0 0 1.8-3L13.7 3.8a2 2 0 0 0-3.4 0Z"></path>
            </svg>
            <span>{{ error() }}</span>
          </div>
        }
      </div>

      <div class="flex flex-col-reverse gap-2 border-t border-base-300 bg-base-200/30 px-5 py-4 sm:flex-row sm:justify-end sm:px-6">
        <button class="btn btn-ghost btn-sm h-10 rounded-xl px-4" (click)="closed.emit()">Cancel</button>
        <button
          class="btn btn-primary btn-sm h-10 rounded-xl px-5"
          (click)="submit()"
          [class.loading]="loading()"
          [disabled]="loading()"
        >
          @if (!loading()) {
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              @if (isUpdate()) {
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"></path>
              } @else {
                <path stroke-linecap="round" d="M12 5v14M5 12h14"></path>
              }
            </svg>
          }
          {{ isUpdate() ? 'Save changes' : 'Create workspace' }}
        </button>
      </div>
    </section>
  </div>
}
