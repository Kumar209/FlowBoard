<div
  class="fixed inset-0 z-[150] flex flex-col items-center justify-center gap-3 bg-base-100/70 backdrop-blur-sm"
>
  <span
    class="loading loading-spinner text-primary"
    [class.loading-sm]="size() === 'sm'"
    [class.loading-lg]="size() === 'lg'"
  ></span>

  @if (text()) {
    <p class="text-xs font-medium text-base-content/70">{{ text() }}</p>
  }
</div>
