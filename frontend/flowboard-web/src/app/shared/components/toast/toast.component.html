<div class="toast toast-top toast-end z-[100]">
  @for (t of toast.toasts(); track t.id) {
    <div class="alert shadow-lg rounded-xl text-sm" [ngClass]="t.type==='success'?'alert-success': t.type==='error'?'alert-error':'alert-info'">
      <span>{{ t.message }}</span>
      <button class="btn btn-ghost btn-xs" (click)="toast.dismiss(t.id)">✕</button>
    </div>
  }
</div>
