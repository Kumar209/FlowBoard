<app-header (click)="close()" />
<app-toast />

<div class="drawer lg:drawer-open min-h-[calc(100vh-64px)]">
  <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" [checked]="sidebarOpen()" (change)="toggle()" />
  <div class="drawer-content flex flex-col bg-base-200">
    <!-- Mobile toggle handled by Header hamburger via layout signal - also allow swipe -->
    <label for="sidebar-drawer" class="btn btn-ghost btn-sm lg:hidden m-2 self-start">☰ Menu</label>
    <main class="flex-1">
      <router-outlet />
    </main>
  </div>
  <div class="drawer-side z-30">
    <label for="sidebar-drawer" aria-label="close sidebar" class="drawer-overlay" (click)="close()"></label>
    <aside class="bg-base-100 w-72 border-r border-base-200 flex flex-col h-[calc(100vh-64px)] lg:sticky lg:top-[64px] lg:overflow-y-auto self-start">


      <ul class="menu p-4 gap-1 flex-1">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="close()" class="rounded-xl"><span class="w-6 text-center">◈</span> Dashboard</a></li>
        <li><a routerLink="/w" routerLinkActive="active" (click)="close()" class="rounded-xl"><span class="w-6 text-center">▦</span> Workspaces</a></li>
        <li><a routerLink="/projects" routerLinkActive="active" (click)="close()" class="rounded-xl"><span class="w-6 text-center">▦</span> Projects</a></li>
        <li><a routerLink="/activity" routerLinkActive="active" (click)="close()" class="rounded-xl"><span class="w-6 text-center">◎</span> Activity</a></li>
        <li><a routerLink="/members" routerLinkActive="active" (click)="close()" class="rounded-xl"><span class="w-6 text-center">◐</span> Members</a></li>
        @if (auth.isOrgAdmin() || auth.isSuperAdmin()) {
          <li class="menu-title mt-4"><span>System</span></li>
          <li><a routerLink="/system" routerLinkActive="active" (click)="close()" class="rounded-xl"><span class="w-6 text-center">●</span> System <span class="badge badge-success badge-xs">Health</span></a></li>
        }
      </ul>

      <div class="p-4 border-t border-base-200">
        <div class="flex items-center gap-3 bg-base-200/50 rounded-xl p-3">
          <div class="w-8 h-8 rounded-full bg-primary text-primary-content flex items-center justify-center text-xs font-bold">{{ (auth.currentUser()?.fullName || 'U').charAt(0) }}</div>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-semibold truncate">{{ auth.currentUser()?.fullName }}</div>
            <div class="text-xs opacity-50 truncate">{{ auth.currentUser()?.email }}</div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
