<div class="min-w-0 overflow-hidden rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm sm:p-5">
  @if (data(); as d) {
    <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
      <div class="min-w-0">
        <h3 class="text-sm font-semibold text-base-content">Sprint Burndown</h3>
        <p class="mt-1 truncate text-xs text-base-content/50">
          {{ d.sprintName }} · {{ d.startDate }} → {{ d.endDate }} · Total {{ d.points[0]?.total ?? 0 }}
        </p>
      </div>
      <span class="badge badge-primary badge-sm shrink-0 rounded-full">{{ d.points.length }} days</span>
    </div>

    <div class="mt-3 min-w-0 overflow-hidden">
      <apx-chart
        [series]="options().series!"
        [chart]="options().chart!"
        [xaxis]="options().xaxis!"
        [yaxis]="options().yaxis!"
        [stroke]="options().stroke!"
        [colors]="options().colors!"
        [fill]="options().fill!"
        [dataLabels]="options().dataLabels!"
        [legend]="options().legend!"
        [grid]="options().grid!"
        class="block w-full"
      ></apx-chart>
    </div>
  } @else {
    <div class="h-[250px] animate-pulse rounded-xl bg-base-200 sm:h-[290px]"></div>
    <p class="mt-2 text-center text-xs text-base-content/50">Select a sprint to view burndown</p>
  }
</div>
