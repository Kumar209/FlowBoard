<div class="min-h-screen flex items-center justify-center p-6 bg-base-200">
  <div class="card bg-base-100 shadow-xl max-w-lg w-full">
    <div class="card-body text-center">
      <div class="text-5xl mb-4">🛠️</div>
      <h1 class="text-2xl font-bold">Platform under maintenance</h1>
      <p class="opacity-70 mt-2">We're performing scheduled maintenance. Please try again in a few minutes.</p>
      <div class="card-actions justify-center mt-6">
        <a routerLink="/" class="btn btn-primary">Go to Dashboard</a>
        <button class="btn btn-ghost" onclick="location.reload()">Retry</button>
      </div>
      <p class="text-xs opacity-50 mt-4">If you are a SuperAdmin, you can disable maintenance via <code>/superadmin/settings</code>.</p>
    </div>
  </div>
</div>
