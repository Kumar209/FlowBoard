name: Deploy Notify

on:
  push:
    branches: [main]
    paths:
      - 'backend/Services/Notification.Service/**'
      - 'backend/BuildingBlocks/**'
      - '.github/workflows/notify.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Notify
        run: dotnet publish backend/Services/Notification.Service/Notification.Service.csproj -c Release -o publish_notify

      - name: Mandatory delete logs folder if exists
        run: |
          if [ -d "publish_notify/logs" ]; then
            echo "Deleting publish_notify/logs"
            rm -rf publish_notify/logs
          else
            echo "No logs folder to delete"
          fi

      - name: Put app_offline.htm to unlock DLL
        run: |
          echo "<html><body>Deploying FlowBoard - site will restart shortly</body></html>" > app_offline.htm
          curl --ftp-create-dirs -T app_offline.htm "ftp://${{ secrets.FTP_HOST_NOTIFY }}/wwwroot/app_offline.htm" --user "${{ secrets.FTP_USER_NOTIFY }}:${{ secrets.FTP_PASS_NOTIFY }}" || echo "app_offline put failed, continue"
          sleep 6

      - name: FTP Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          port: 21
          server: ${{ secrets.FTP_HOST_NOTIFY }}
          username: ${{ secrets.FTP_USER_NOTIFY }}
          password: ${{ secrets.FTP_PASS_NOTIFY }}
          local-dir: ./publish_notify/
          server-dir: /wwwroot/
          dangerous-clean-slate: false
          exclude: |
            **/.well-known/**

      - name: Remove app_offline.htm
        if: always()
        run: |
          curl "ftp://${{ secrets.FTP_HOST_NOTIFY }}/" --user "${{ secrets.FTP_USER_NOTIFY }}:${{ secrets.FTP_PASS_NOTIFY }}" -Q "DELE wwwroot/app_offline.htm" || echo "app_offline delete failed, continue"
