name: Deploy Gateway

on:
  push:
    branches: [main]
    paths:
      - 'backend/Gateway.YARP/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Gateway
        run: dotnet publish backend/Gateway.YARP/Gateway.YARP.csproj -c Release -o publish_gateway

      - name: Mandatory delete logs folder if exists
        run: |
          if [ -d "publish_gateway/logs" ]; then
            echo "Deleting publish_gateway/logs"
            rm -rf publish_gateway/logs
          else
            echo "No logs folder to delete"
          fi

      - name: Put app_offline.htm to unlock DLL
        run: |
          echo "<html><body>Deploying FlowBoard - site will restart shortly</body></html>" > app_offline.htm
          curl --ftp-create-dirs -T app_offline.htm "ftp://${{ secrets.FTP_HOST_GATEWAY }}/wwwroot/app_offline.htm" --user "${{ secrets.FTP_USER_GATEWAY }}:${{ secrets.FTP_PASS_GATEWAY }}" || echo "app_offline put failed, continue"
          sleep 6

      - name: FTP Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          port: 21
          server: ${{ secrets.FTP_HOST_GATEWAY }}
          username: ${{ secrets.FTP_USER_GATEWAY }}
          password: ${{ secrets.FTP_PASS_GATEWAY }}
          local-dir: ./publish_gateway/
          server-dir: /wwwroot/
          dangerous-clean-slate: false
          exclude: |
            **/.well-known/**

      - name: Remove app_offline.htm
        if: always()
        run: |
          curl "ftp://${{ secrets.FTP_HOST_GATEWAY }}/" --user "${{ secrets.FTP_USER_GATEWAY }}:${{ secrets.FTP_PASS_GATEWAY }}" -Q "DELE wwwroot/app_offline.htm" || echo "app_offline delete failed, continue"
